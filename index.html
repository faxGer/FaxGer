<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaxGer Express</title>

    <!-- দ্রুত লোডের জন্য আগে থেকেই সংযোগ তৈরি -->
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="dns-prefetch" href="https://script.google.com">
    <link rel="dns-prefetch" href="https://ssl.gstatic.com">
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">

    <style>
        :root {
            --primary: #007bff;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
        }
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.4s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        #status-text {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
            font-weight: 500;
            text-align: center;
            padding: 0 16px;
        }
        #retry-btn {
            display: none;
            margin-top: 16px;
            padding: 10px 26px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        #retry-btn.show {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #main-app {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #main-app.loaded {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="status-text">Loading application...</div>
        <button id="retry-btn" type="button">Retry</button>
    </div>

    <iframe id="main-app" title="FaxGer Global Logistics" loading="eager"></iframe>

    <script>
    (function () {
        // ===== সেটিংস =====
        var BASE_URL = "https://script.google.com/macros/s/AKfycbyR8bmTqg5_L6CdVYZHz5oTse6GKHREM92rDXAjQlF0IHMVrDaoGjOutzypjmB4QbxN/exec";
        // মূল app এ "app_ready" কোড বসালে এটা true করুন (নিচের নির্দেশনা দেখুন)। না বসালে false থাকুক।
        var APP_SENDS_READY = false;
        var SHELL_WAIT = 1500;     // APP_SENDS_READY=false হলে: iframe লোডের এতক্ষণ পর loader সরবে (ms)
        var READY_MAX = 8000;      // APP_SENDS_READY=true হলে: app_ready না এলে সর্বোচ্চ এতক্ষণ পর loader সরবে (ms)
        var SLOW_AFTER = 12000;    // এর মধ্যে কিছু না হলে Retry বাটন দেখাবে (ms)

        var iframe = document.getElementById('main-app');
        var loader = document.getElementById('loader');
        var statusText = document.getElementById('status-text');
        var retryBtn = document.getElementById('retry-btn');
        var shown = false, started = false, shellTimer = null, slowTimer = null;

        // আইফ্রেমের সিকিউরিটি পলিসি (src সেট করার আগেই)
        iframe.setAttribute('sandbox', 'allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads allow-top-navigation allow-top-navigation-by-user-activation');
        // Camera (Barcode Scan), Microphone, Location, Clipboard, Fullscreen, Beep sound
        iframe.setAttribute('allow', 'camera *; microphone *; geolocation *; clipboard-read *; clipboard-write *; fullscreen *; autoplay *');

        function trusted(origin) {
            try {
                var h = new URL(origin).hostname;
                return h === 'script.google.com' || /(^|\.)googleusercontent\.com$/.test(h);
            } catch (e) { return false; }
        }

        function showApp() {
            if (shown) return;
            shown = true;
            clearTimeout(shellTimer);
            clearTimeout(slowTimer);
            retryBtn.classList.remove('show');
            iframe.classList.add('loaded');
            loader.classList.add('hidden');
        }

        function showSlow() {
            if (shown) return;
            statusText.textContent = 'লোড হতে বেশি সময় লাগছে...';
            statusText.style.color = '#ff4757';
            retryBtn.classList.add('show');
        }

        function load() {
            shown = false;
            started = true;
            clearTimeout(shellTimer);
            clearTimeout(slowTimer);
            retryBtn.classList.remove('show');
            iframe.classList.remove('loaded');
            loader.classList.remove('hidden');
            statusText.textContent = 'Loading application...';
            statusText.style.color = '#333';
            slowTimer = setTimeout(showSlow, SLOW_AFTER);
            iframe.src = BASE_URL + (BASE_URL.indexOf('?') > -1 ? '&' : '?') + '_nc=' + Date.now();
        }

        // iframe এর খোলস লোড হলে (ভেতরের app তখনও আসতে পারে)
        iframe.addEventListener('load', function () {
            if (!started || shown) return;
            statusText.textContent = 'FaxGer Global Logistics';
            clearTimeout(shellTimer);
            shellTimer = setTimeout(showApp, APP_SENDS_READY ? READY_MAX : SHELL_WAIT);
        });

        // ভেতরের app থেকে মেসেজ (Google এর sandbox origin সহ)
        window.addEventListener('message', function (event) {
            if (!trusted(event.origin)) return;
            var data = event.data;
            try { if (typeof data === 'string') data = JSON.parse(data); } catch (e) { return; }
            if (!data || typeof data !== 'object') return;
            if (data.action === 'app_ready') showApp();
            if (data.action === 'sync_complete') statusText.textContent = 'Data Synced Safely';
        });

        retryBtn.addEventListener('click', load);

        window.addEventListener('offline', function () {
            statusText.textContent = 'Offline - Check Connection';
            statusText.style.color = '#ff4757';
        });

        // ইন্টারনেট ফিরলে, app এখনও না এসে থাকলে আবার লোড করবে
        window.addEventListener('online', function () {
            statusText.style.color = '#333';
            statusText.textContent = 'Reconnecting...';
            if (!shown) load();
        });

        // আইওএস (iOS) ওয়েবকিট স্কেল মিটিগেশন
        document.body.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        load();
    })();
    </script>

</body>
</html>
