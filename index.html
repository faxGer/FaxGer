<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Language" content="en">

    <!-- App Install: আসল ফাইল (না পেলে নিচের JS নিজে বানিয়ে নেবে) -->
    <link id="manifest-link" rel="manifest" href="manifest.webmanifest">

    <link id="touch" rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://script.google.com" crossorigin>

    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">

    <style>
        :root {
            --primary: #007bff;
            --navy: #0b1e3f;
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
        }

        /* ================= Loader ================= */
        #loader {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
            background:
                radial-gradient(1200px 700px at 15% -10%, #14418a 0%, transparent 60%),
                radial-gradient(900px 600px at 110% 110%, #0f5fb8 0%, transparent 55%),
                linear-gradient(160deg, #0b1e3f, #071530);
            opacity: 1;
            visibility: visible;
            transition: opacity .7s ease, visibility 0s linear 0s;
        }
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .7s ease, visibility 0s linear .7s;
        }
        #loader .bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .45;
            animation: floaty 14s ease-in-out infinite;
        }
        .o1 { width: 340px; height: 340px; background: #1d6fe0; top: -90px; left: -80px; }
        .o2 { width: 300px; height: 300px; background: #0ea5e9; bottom: -90px; right: -70px; animation-delay: -6s; }
        .grid {
            position: absolute; top: 0; right: 0; bottom: 0; left: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 44px 44px;
            -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 70%);
            mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 70%);
        }
        @keyframes floaty {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 24px); }
        }

        .stage {
            position: relative;
            z-index: 2;
            width: min(88vw, 360px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: none; }
        }

        .emblem {
            position: relative;
            width: 132px;
            height: 132px;
            display: grid;
            place-items: center;
        }
        .ring {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            animation: spin 1.8s linear infinite;
        }
        .ring .track { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 3; }
        .ring .arc {
            fill: none;
            stroke: url(#grad);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 90 262;
        }
        .pulse {
            position: absolute;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(56,189,248,.35);
            animation: pulse 2.2s ease-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(.9); opacity: .7; }
            100% { transform: scale(1.55); opacity: 0; }
        }
        .tile {
            position: relative;
            width: 84px;
            height: 84px;
            border-radius: 22px;
            background: #ffffff;
            display: grid;
            place-items: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 6px rgba(255,255,255,.08);
        }
        .tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            opacity: 0;
            transition: opacity .5s ease;
        }
        .tile img.ok { opacity: 1; }
        .tile .mono {
            position: absolute;
            font-weight: 800;
            font-size: 28px;
            letter-spacing: 1px;
            color: #0b3a8a;
        }
        .tile.has .mono { display: none; }

        .brand {
            margin: 26px 0 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: .4px;
        }
        .brand span {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #9cc4ff;
        }
        #status-text {
            margin-top: 24px;
            min-height: 20px;
            padding: 0 12px;
            font-size: 14px;
            font-weight: 500;
            color: #dbe8ff;
            transition: opacity .16s ease;
        }
        .bar {
            position: relative;
            width: 100%;
            height: 6px;
            margin-top: 14px;
            border-radius: 99px;
            background: rgba(255,255,255,.14);
            overflow: hidden;
        }
        #bar-fill {
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 0;
            border-radius: 99px;
            background: linear-gradient(90deg, #38bdf8, #3b82f6, #38bdf8);
            background-size: 200% 100%;
            animation: shimmer 1.4s linear infinite;
            transition: width .35s ease;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }
        .meta {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 8px;
            font-size: 12px;
            color: #9cb4d8;
        }
        .steps {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }
        .steps i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,.2);
            transition: background .3s ease, transform .3s ease;
        }
        .steps i.on { background: #38bdf8; transform: scale(1.25); }
        #retry-btn {
            display: none;
            margin-top: 20px;
            padding: 11px 30px;
            font-size: 15px;
            font-weight: 700;
            color: #0b1e3f;
            background: #ffffff;
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,.3);
        }
        #retry-btn.show { display: inline-block; }
        .foot {
            position: absolute;
            left: 0; right: 0;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            z-index: 2;
            text-align: center;
            font-size: 11px;
            letter-spacing: .8px;
            color: #7f9bc7;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .orb, .pulse, #bar-fill, .stage { animation: none; }
            .ring { animation-duration: 6s; }
        }

        /* ================= App iframe ================= */
        #main-app {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity .5s ease;
        }
        #main-app.loaded { opacity: 1; }

        /* ================= Install / Hint ================= */
        #install-box {
            display: none;
            position: fixed;
            left: 14px;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            z-index: 1000;
            align-items: center;
            background: #ffffff;
            border: 1px solid #c3ccdb;
            border-radius: 999px;
            box-shadow: 0 4px 14px rgba(0,0,0,.25);
            overflow: hidden;
        }
        #install-box.show { display: flex; }
        #install-btn {
            border: 0;
            background: var(--primary);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 16px;
            cursor: pointer;
        }
        #install-x, #hint-x {
            border: 0;
            background: transparent;
            color: #555;
            font-size: 20px;
            line-height: 1;
            padding: 6px 12px;
            cursor: pointer;
        }
        #hint-box {
            display: none;
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            z-index: 1000;
            align-items: center;
            gap: 4px;
            max-width: 460px;
            margin: 0 auto;
            padding: 10px 6px 10px 16px;
            background: #0b1e3f;
            color: #fff;
            font-size: 13.5px;
            line-height: 1.4;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        #hint-box.show { display: flex; }
        #hint-text { flex: 1; }
        #hint-x { color: #fff; }
                /* ================= WhatsApp floating button (টেনে সরানো যায়) ================= */
        #wa-btn {
            position: fixed;
            right: 16px;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            z-index: 900;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #25d366;
            display: grid;
            place-items: center;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
            transition: transform .2s ease;
            touch-action: none;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
        }
        #wa-btn:hover { transform: scale(1.08); }
        #wa-btn.drag {
            cursor: grabbing;
            transform: scale(1.12);
            transition: none;
            box-shadow: 0 10px 26px rgba(0, 0, 0, .4);
        }
        #wa-btn.drag::before { display: none; }
        #wa-btn svg { width: 30px; height: 30px; fill: #ffffff; pointer-events: none; }
        #wa-btn::before {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            border-radius: 50%;
            background: #25d366;
            opacity: .5;
            z-index: -1;
            animation: waPulse 2.4s ease-out infinite;
        }
        @keyframes waPulse {
            0% { transform: scale(1); opacity: .5; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            #wa-btn::before { animation: none; display: none; }
        }
            /* ================= Barcode Scanner (wrapper) ================= */
        #scan-overlay {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 2000;
            background: rgba(7, 21, 48, .82);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #scan-overlay.show { display: flex; }
        .scan-box {
            width: min(94vw, 460px);
            background: #ffffff;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, .45);
            text-align: center;
        }
        .scan-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
            color: #0b1e3f;
        }
        .scan-head button {
            border: 0;
            background: transparent;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
            color: #555;
            padding: 0 6px;
        }
        #scan-video {
            width: 100%;
            max-height: 60vh;
            border-radius: 12px;
            background: #000;
            object-fit: cover;
        }
        #scan-msg {
            min-height: 18px;
            margin: 10px 4px 0;
            font-size: 13px;
            color: #475569;
        }
        #scan-photo-btn {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border: 0;
            border-radius: 10px;
            background: #0b1e3f;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

    <script>
    (function () {
        'use strict';

        // ===================== Settings =====================
        var BASE_URL = "https://script.google.com/macros/s/AKfycbyYPrCuUAG22Gwcltd7k6dQG_rAcEXs2HWvcSNQ7SohXep8-faMuYsc9k1MAqqnj371/exec";
        var LOGO_ID = "1wuovCUooF2nOBUhbe_P23K1-xeldjw7a";
        var APP_SENDS_READY = false;  // মূল app এ "app_ready" কোড বসালে true করুন (সবচেয়ে ভালো)
        var SHELL_WAIT = 3500;        // APP_SENDS_READY=false হলে: iframe লোডের এতক্ষণ পর loader সরবে (ms)
        var READY_MAX = 15000;        // APP_SENDS_READY=true হলে: app_ready না এলে সর্বোচ্চ অপেক্ষা (ms)
        var SLOW_AFTER = 25000;       // এর মধ্যে কিছু না হলে Retry বাটন (ms)
        var MIN_SHOW = 1200;          // loader কমপক্ষে এতক্ষণ দেখাবে (ms)
        var FINISH_DELAY = 500;       // 100% দেখানোর পর সরার আগে বিরতি (ms)

        var DRIVE_LOGOS = [
            "https://lh3.googleusercontent.com/d/" + LOGO_ID + "=s512",
            "https://drive.google.com/thumbnail?id=" + LOGO_ID + "&sz=w512",
            "https://drive.google.com/uc?export=view&id=" + LOGO_ID
        ];
        var STAGES = [
            [0,  'Connecting securely...'],
            [25, 'Loading your workspace...'],
            [55, 'Preparing dashboard...'],
            [80, 'Almost ready...']
        ];

        // ===================== Elements / State =====================
        var $ = function (id) { return document.getElementById(id); };
        var iframe = $('main-app'), loader = $('loader'), statusText = $('status-text'),
            retryBtn = $('retry-btn'), barFill = $('bar-fill'), pctEl = $('pct'),
            tile = $('tile'), logoEl = $('logo'), dots = loader.querySelectorAll('.steps i');
        var shown = false, started = false, slowShown = false, shellLoaded = false,
            runId = 0, startAt = Date.now(), shellTimer = null, slowTimer = null,
            progTimer = null, prog = 0, stageIdx = -1;

        // ===================== Loader helpers =====================
        function setStatus(t, color) {
            statusText.style.opacity = 0;
            setTimeout(function () {
                statusText.textContent = t;
                statusText.style.color = color || '';
                statusText.style.opacity = 1;
            }, 160);
        }
        function render() {
            barFill.style.width = prog.toFixed(1) + '%';
            pctEl.textContent = Math.floor(prog) + '%';
            var idx = 0, i;
            for (i = 0; i < STAGES.length; i++) if (prog >= STAGES[i][0]) idx = i;
            for (i = 0; i < dots.length; i++) dots[i].className = i <= idx ? 'on' : '';
            if (idx !== stageIdx && !shown && !slowShown && navigator.onLine !== false) {
                stageIdx = idx;
                setStatus(STAGES[idx][1]);
            }
        }
        function showApp() {
            if (shown) return;
            shown = true;
            var my = runId;
            clearTimeout(shellTimer);
            clearTimeout(slowTimer);
            clearInterval(progTimer);
            retryBtn.classList.remove('show');
            prog = 100; render();
            for (var i = 0; i < dots.length; i++) dots[i].className = 'on';
            setStatus('Ready');
            var wait = Math.max(0, MIN_SHOW - (Date.now() - startAt)) + FINISH_DELAY;
            setTimeout(function () {
                if (my !== runId) return;
                iframe.classList.add('loaded');
                loader.classList.add('hidden');
            }, wait);
        }
        function showSlow() {
            if (shown) return;
            slowShown = true;
            setStatus('Taking longer than usual...', '#ffb4b4');
            retryBtn.classList.add('show');
        }
        function load() {
            runId++;
            shown = false; started = true; slowShown = false; shellLoaded = false;
            startAt = Date.now();
            clearTimeout(shellTimer); clearTimeout(slowTimer); clearInterval(progTimer);
            retryBtn.classList.remove('show');
            iframe.classList.remove('loaded');
            loader.classList.remove('hidden');
            prog = 0; stageIdx = -1; render();
            progTimer = setInterval(function () {
                if (shown) return;
                var cap = shellLoaded ? 94 : 78;   // আনুমানিক অগ্রগতি (আসল ডাউনলোড মাপা নয়)
                prog += (cap - prog) * 0.04 + 0.08;
                if (prog > cap) prog = cap;
                render();
            }, 120);
            slowTimer = setTimeout(showSlow, SLOW_AFTER);
            iframe.src = BASE_URL + (BASE_URL.indexOf('?') > -1 ? '&' : '?') + '_nc=' + Date.now();
        }

        // ===================== iframe security / permissions =====================
        iframe.setAttribute('sandbox', 'allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads allow-top-navigation allow-top-navigation-by-user-activation');
        // Camera (Barcode Scan), Microphone, Location, Clipboard, Fullscreen, Beep sound
        iframe.setAttribute('allow', 'camera *; microphone *; geolocation *; clipboard-read *; clipboard-write *; fullscreen *; autoplay *');

        function trusted(origin) {
            try {
                var h = new URL(origin).hostname;
                return h === 'script.google.com' || /(^|\.)googleusercontent\.com$/.test(h);
            } catch (e) { return false; }
        }

        iframe.addEventListener('load', function () {
            if (!started || shown) return;
            shellLoaded = true;
            prog = Math.max(prog, 55);
            clearTimeout(shellTimer);
            shellTimer = setTimeout(showApp, APP_SENDS_READY ? READY_MAX : SHELL_WAIT);
        });

        window.addEventListener('message', function (event) {
            if (!trusted(event.origin)) return;
            var data = event.data;
            try { if (typeof data === 'string') data = JSON.parse(data); } catch (e) { return; }
            if (!data || typeof data !== 'object') return;
            if (data.action === 'app_ready') showApp();
            if (data.action === 'sync_complete' && !shown) setStatus('Data synced safely');
        });

        retryBtn.addEventListener('click', load);
        window.addEventListener('offline', function () { setStatus('Offline - check your connection', '#ffb4b4'); });
        window.addEventListener('online', function () {
            setStatus('Reconnecting...');
            if (!shown) load();
        });
        document.body.addEventListener('gesturestart', function (e) { e.preventDefault(); });   // iOS scale mitigation

        // ===================== Install App (PWA) =====================
        var UA = navigator.userAgent || '';
        var isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isAndroid = /android/i.test(UA);
        var inApp = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|Messenger|; wv\)/i.test(UA);
        var deferredPrompt = null;
        var installBox = $('install-box'), hintBox = $('hint-box'), hintText = $('hint-text');

        function isStandalone() {
            return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
        }
        function getFlag(k) { try { return localStorage.getItem(k) === '1'; } catch (e) { return false; } }
        function setFlag(k) { try { localStorage.setItem(k, '1'); } catch (e) {} }

        // এই listener আগে বসানো দরকার, যাতে event মিস না হয়
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredPrompt = e;
            hintBox.classList.remove('show');
            if (!isStandalone() && !getFlag('faxger_install_dismissed')) installBox.classList.add('show');
        });
        window.addEventListener('appinstalled', function () {
            deferredPrompt = null;
            installBox.classList.remove('show');
            hintBox.classList.remove('show');
        });
        $('install-btn').addEventListener('click', function () {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function () {
                deferredPrompt = null;
                installBox.classList.remove('show');
            });
        });
        $('install-x').addEventListener('click', function () {
            installBox.classList.remove('show');
            setFlag('faxger_install_dismissed');
        });
        $('hint-x').addEventListener('click', function () {
            hintBox.classList.remove('show');
            setFlag('faxger_hint_dismissed');
        });
        function showHint(t) {
            if (isStandalone() || getFlag('faxger_hint_dismissed')) return;
            hintText.textContent = t;
            hintBox.classList.add('show');
        }
        // Install বাটন না এলে (iPhone / in-app browser / Chrome menu) নির্দেশনা দেখাবে
        setTimeout(function () {
            if (isStandalone() || deferredPrompt) return;
            if (inApp) showHint('To install the app, open this page in Chrome.');
            else if (isIOS) showHint('To install: tap the Share button, then "Add to Home Screen".');
            else if (isAndroid) showHint('To install: tap the \u22EE menu, then "Install app" or "Add to Home screen".');
        }, 9000);

        // ===================== Logo / Icons / Manifest =====================
        function exists(url, kind) {
            return fetch(url, { cache: 'no-cache' }).then(function (r) {
                if (!r.ok) return false;
                if (kind === 'json') return r.json().then(function (m) { return !!(m && m.icons); }, function () { return false; });
                return (r.headers.get('content-type') || '').toLowerCase().indexOf('image/') === 0;
            }).catch(function () { return false; });
        }
        function loadLogo(i, urls, done) {
            if (i >= urls.length) return done(null);
            var img = new Image();
            img.crossOrigin = 'anonymous';
            img.referrerPolicy = 'no-referrer';
            img.onload = function () {
                if (img.naturalWidth < 32) return loadLogo(i + 1, urls, done);
                done(img);
            };
            img.onerror = function () { loadLogo(i + 1, urls, done); };
            img.src = urls[i];
        }
        function makeIcon(img, size, pad) {
            var c = document.createElement('canvas');
            c.width = c.height = size;
            var x = c.getContext('2d');
            x.fillStyle = '#ffffff';
            x.fillRect(0, 0, size, size);
            var box = size * (1 - 2 * pad);
            var r = Math.min(box / img.naturalWidth, box / img.naturalHeight);
            var w = img.naturalWidth * r, h = img.naturalHeight * r;
            x.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
            return c.toDataURL('image/png');
        }
        function fallbackIcon(size) {
            var c = document.createElement('canvas');
            c.width = c.height = size;
            var x = c.getContext('2d');
            x.fillStyle = '#0b3a8a';
            x.fillRect(0, 0, size, size);
            x.fillStyle = '#ffffff';
            x.font = 'bold ' + Math.round(size * 0.42) + 'px Arial';
            x.textAlign = 'center';
            x.textBaseline = 'middle';
            x.fillText('FG', size / 2, size / 2);
            return c.toDataURL('image/png');
        }
        function setIconLink(id, href) {
            var l = $(id);
            if (l && href) l.href = href;
        }
        function buildManifest(i192, i512, iMask) {
            if (!/^https?:$/.test(location.protocol)) return;
            var start = location.origin + location.pathname;
            var scope = location.origin + location.pathname.replace(/[^\/]*$/, '');
            var m = {
                id: start, name: 'FaxGer Express', short_name: 'FaxGer', description: 'FaxGer Global Logistics',
                lang: 'en', dir: 'ltr', start_url: start, scope: scope, display: 'standalone',
                background_color: '#0b1e3f', theme_color: '#0b1e3f',
                icons: [
                    { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
                    { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
                    { src: iMask, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
                ]
            };
            var old = $('manifest-link');
            if (old && old.parentNode) old.parentNode.removeChild(old);
            var link = document.createElement('link');
            link.id = 'manifest-link';
            link.rel = 'manifest';
            link.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
            document.head.appendChild(link);
        }
        function setupApp() {
            Promise.all([
                exists('manifest.webmanifest', 'json'),
                exists('icon-192.png', 'image'),
                exists('icon-512.png', 'image')
            ]).then(function (r) {
                var staticOk = r[0] && r[1] && r[2];   // আসল ফাইল থাকলে সেগুলোই ব্যবহার হবে (মোবাইল Install এর জন্য সবচেয়ে ভালো)
                var urls = (staticOk ? ['icon-512.png'] : []).concat(DRIVE_LOGOS);
                loadLogo(0, urls, function (img) {
                    if (img) { logoEl.src = img.src; logoEl.classList.add('ok'); tile.classList.add('has'); }
                    if (staticOk) return;
                    var i192, i512, iMask;
                    try {
                        if (!img) throw new Error('no logo');
                        i192 = makeIcon(img, 192, 0.04);
                        i512 = makeIcon(img, 512, 0.04);
                        iMask = makeIcon(img, 512, 0.2);
                    } catch (e) {
                        i192 = fallbackIcon(192); i512 = fallbackIcon(512); iMask = i512;
                    }
                    setIconLink('fav', i192);
                    setIconLink('touch', i192);
                    buildManifest(i192, i512, iMask);
                });
            });
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(function () {});   // sw.js না থাকলেও সমস্যা নেই
            }
        }

                // ===================== WhatsApp বাটন: টেনে যেকোনো জায়গায় সরানো যাবে =====================
        (function () {
            var wa = $('wa-btn');
            if (!wa) return;
            var KEY = 'faxger_wa_pos', MARGIN = 8, THRESHOLD = 6;
            var drag = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, pid = null;

            function size() { return wa.offsetWidth || 56; }
            function place(x, y) {
                var maxX = Math.max(MARGIN, window.innerWidth - size() - MARGIN);
                var maxY = Math.max(MARGIN, window.innerHeight - size() - MARGIN);
                x = Math.min(Math.max(MARGIN, x), maxX);
                y = Math.min(Math.max(MARGIN, y), maxY);
                wa.style.left = x + 'px';
                wa.style.top = y + 'px';
                wa.style.right = 'auto';
                wa.style.bottom = 'auto';
            }
            // অবস্থান শতাংশ হিসেবে রাখা হয়, তাই screen ঘোরালেও প্রায় একই জায়গায় থাকে
            function save() {
                try {
                    var r = wa.getBoundingClientRect();
                    var w = Math.max(1, window.innerWidth - size() - 2 * MARGIN);
                    var h = Math.max(1, window.innerHeight - size() - 2 * MARGIN);
                    localStorage.setItem(KEY, JSON.stringify([(r.left - MARGIN) / w, (r.top - MARGIN) / h]));
                } catch (e) {}
            }
            function restore() {
                var v = null;
                try { v = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
                if (!v || v.length !== 2 || isNaN(v[0]) || isNaN(v[1])) return;
                var w = Math.max(0, window.innerWidth - size() - 2 * MARGIN);
                var h = Math.max(0, window.innerHeight - size() - 2 * MARGIN);
                place(MARGIN + v[0] * w, MARGIN + v[1] * h);
            }

            wa.addEventListener('pointerdown', function (e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                var r = wa.getBoundingClientRect();
                drag = true; moved = false; pid = e.pointerId;
                sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
                try { wa.setPointerCapture(pid); } catch (x) {}   // iframe এর উপর দিয়ে টানলেও ইভেন্ট হারাবে না
            });
            wa.addEventListener('pointermove', function (e) {
                if (!drag || e.pointerId !== pid) return;
                var dx = e.clientX - sx, dy = e.clientY - sy;
                if (!moved && Math.abs(dx) + Math.abs(dy) < THRESHOLD) return;
                if (!moved) { moved = true; wa.classList.add('drag'); }
                place(ox + dx, oy + dy);
                e.preventDefault();
            });
            function end(e) {
                if (!drag || (e && e.pointerId !== pid)) return;
                drag = false;
                try { wa.releasePointerCapture(pid); } catch (x) {}
                wa.classList.remove('drag');
                if (moved) {
                    save();
                    setTimeout(function () { moved = false; }, 80);   // টানার পর ভুলে WhatsApp খোলা আটকায়
                }
            }
            wa.addEventListener('pointerup', end);
            wa.addEventListener('pointercancel', end);
            wa.addEventListener('click', function (e) {
                if (moved) { e.preventDefault(); e.stopPropagation(); }
            });
            wa.addEventListener('dragstart', function (e) { e.preventDefault(); });
            wa.addEventListener('contextmenu', function (e) { e.preventDefault(); });
            window.addEventListener('resize', function () {
                if (!wa.style.left) return;
                var r = wa.getBoundingClientRect();
                place(r.left, r.top);
            });

            restore();
        })();

                // ===================== Barcode Scanner (wrapper এ চলে — Google iframe এর camera বাধা এড়াতে) =====================
        (function () {
            var ov = $('scan-overlay'), vid = $('scan-video'), msg = $('scan-msg'),
                closeBtn = $('scan-close'), photoBtn = $('scan-photo-btn'), photoIn = $('scan-photo-input');
            if (!ov || !vid) return;

            var stream = null, timer = null, busy = false, decoder = null,
                requester = null, reqId = 0, finished = true;

            function reply(obj) {
                try { if (requester) requester.postMessage(obj, '*'); } catch (e) {}
            }
            function stopCam() {
                clearTimeout(timer);
                busy = false;
                if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
                try { vid.pause(); } catch (e) {}
                vid.srcObject = null;
            }
            function closeScanner(cancelled) {
                var wasOpen = !finished;
                finished = true;
                stopCam();
                ov.classList.remove('show');
                if (cancelled && wasOpen) reply({ action: 'scan_cancel', id: reqId });
            }
            function finish(value) {
                if (finished) return;
                finished = true;
                stopCam();
                ov.classList.remove('show');
                if (navigator.vibrate) { try { navigator.vibrate(100); } catch (e) {} }
                reply({ action: 'scan_result', id: reqId, value: String(value) });
            }

            // ---- বারকোড পড়ার ইঞ্জিন: আগে ব্রাউজারের নিজস্ব, না থাকলে ZXing ----
            function loadZXing() {
                if (window.ZXing) return Promise.resolve();
                return new Promise(function (ok, no) {
                    var s = document.createElement('script');
                    s.src = 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';
                    s.onload = function () { ok(); };
                    s.onerror = function () { no(new Error('Scanner library failed to load')); };
                    document.head.appendChild(s);
                });
            }
            function getDecoder() {
                if (decoder) return Promise.resolve(decoder);
                var tryNative = (window.BarcodeDetector && BarcodeDetector.getSupportedFormats)
                    ? BarcodeDetector.getSupportedFormats().then(function (sup) {
                        var wanted = ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'itf', 'qr_code'].filter(function (f) { return sup.indexOf(f) > -1; });
                        if (!wanted.length) return null;
                        var det = new BarcodeDetector({ formats: wanted });
                        return function (src) {
                            return det.detect(src).then(function (c) { return (c && c.length) ? c[0].rawValue : ''; });
                        };
                    }).catch(function () { return null; })
                    : Promise.resolve(null);

                return tryNative.then(function (d) {
                    if (d) { decoder = d; return d; }
                    return loadZXing().then(function () {
                        var hints = new Map();
                        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                            ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.EAN_13,
                            ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE
                        ]);
                        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                        var reader = new ZXing.MultiFormatReader();
                        reader.setHints(hints);
                        decoder = function (src) {
                            try {
                                var lum = new ZXing.HTMLCanvasElementLuminanceSource(src);
                                var bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
                                return Promise.resolve(reader.decode(bmp).getText());
                            } catch (e) { return Promise.resolve(''); }
                        };
                        return decoder;
                    });
                });
            }

            // ---- লাইভ ক্যামেরা স্ক্যান ----
            function loop(dec) {
                var cv = document.createElement('canvas');
                var ctx = cv.getContext('2d', { willReadFrequently: true });
                (function tick() {
                    if (finished || !stream) return;
                    if (!busy && vid.readyState >= 2 && vid.videoWidth > 0) {
                        busy = true;
                        cv.width = vid.videoWidth;
                        cv.height = vid.videoHeight;
                        ctx.drawImage(vid, 0, 0, cv.width, cv.height);
                        dec(cv).then(function (v) {
                            busy = false;
                            if (v) finish(v); else timer = setTimeout(tick, 150);
                        }, function () {
                            busy = false;
                            timer = setTimeout(tick, 150);
                        });
                        return;
                    }
                    timer = setTimeout(tick, 150);
                })();
            }
            function startCam() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    msg.textContent = 'Live camera is not available in this browser. Use "Scan from a photo" below.';
                    return;
                }
                msg.textContent = 'Starting camera... tap "Allow" if the browser asks.';
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                }).then(function (s) {
                    if (finished) { s.getTracks().forEach(function (t) { t.stop(); }); return null; }
                    stream = s;
                    vid.muted = true;
                    vid.srcObject = s;
                    return vid.play();
                }).then(function () {
                    if (finished || !stream) return null;
                    msg.textContent = 'Point the camera at the barcode...';
                    return getDecoder().then(loop);
                }).catch(function (err) {
                    stopCam();
                    var m = 'Could not start the live camera.';
                    if (err && err.name === 'NotAllowedError') m = 'Camera permission is blocked. Tap the lock icon in the address bar and allow Camera.';
                    else if (err && err.name === 'NotFoundError') m = 'No camera was found.';
                    else if (err && err.name === 'NotReadableError') m = 'The camera is being used by another app.';
                    msg.textContent = m + ' You can use "Scan from a photo" below.';
                });
            }

            // ---- ছবি তুলে স্ক্যান ----
            photoBtn.addEventListener('click', function () { photoIn.click(); });
            photoIn.addEventListener('change', function () {
                var f = photoIn.files && photoIn.files[0];
                photoIn.value = '';
                if (!f) return;
                msg.textContent = 'Reading the barcode from the photo...';
                var url = URL.createObjectURL(f), img = new Image();
                img.onload = function () {
                    URL.revokeObjectURL(url);
                    getDecoder().then(function (dec) {
                        var sides = [1600, 2400, 1000], i = 0;
                        (function next() {
                            if (finished) return;
                            if (i >= sides.length) {
                                msg.textContent = 'No barcode found in the photo. Hold the barcode close, straight and clear, then try again.';
                                return;
                            }
                            var sc = Math.min(1, sides[i++] / Math.max(img.naturalWidth, img.naturalHeight));
                            var cv = document.createElement('canvas');
                            cv.width = Math.round(img.naturalWidth * sc);
                            cv.height = Math.round(img.naturalHeight * sc);
                            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                            dec(cv).then(function (v) { if (v) finish(v); else next(); }, next);
                        })();
                    }).catch(function () {
                        msg.textContent = 'Could not read the photo. Check your internet connection and try again.';
                    });
                };
                img.onerror = function () {
                    URL.revokeObjectURL(url);
                    msg.textContent = 'Could not open the photo.';
                };
                img.src = url;
            });

            closeBtn.addEventListener('click', function () { closeScanner(true); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && !finished) closeScanner(true);
            });

            // ---- ভেতরের app থেকে "স্ক্যান করো" অনুরোধ ----
            window.addEventListener('message', function (event) {
                if (!trusted(event.origin)) return;
                var d = event.data;
                if (!d || typeof d !== 'object' || d.action !== 'scan_request') return;

                stopCam();
                requester = event.source;
                reqId = d.id;
                finished = false;
                reply({ action: 'scan_ack', id: reqId });   // app কে জানানো: wrapper স্ক্যান করছে
                msg.textContent = '';
                ov.classList.add('show');
                startCam();
            });
        })();

        load();        // আগে app লোড শুরু
        setupApp();    // তারপর logo / manifest (app লোডকে আটকায় না)
    })();
    </script>
